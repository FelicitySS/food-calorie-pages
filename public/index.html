<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f7f9f5" />
  <meta name="description" content="拍张照片，快速估算餐食热量。" />
  <title>拍照算热量</title>
  <link rel="stylesheet" href="/style.css" />
  <script src="/app.js" defer></script>
</head>
<body>
  <main class="app">
    <header class="header">
      <div class="brand-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 3.5v17M7 7.8v3.6c0 1.3.7 2.3 2 2.5V20M16.8 7.7v12M19 7.7v5.1c0 1.2-.7 2.1-2.2 2.1"/></svg>
      </div>
      <div>
        <div class="overline">FOOD LENS</div>
        <h1>拍照算热量</h1>
      </div>
    </header>

    <section class="capture-section" aria-labelledby="photo-title">
      <div class="section-heading">
        <h2 id="photo-title">拍一张食物照片</h2>
        <span class="step">01 / 02</span>
      </div>
      <div class="photo-area" id="photoArea" aria-live="polite">
        <div class="empty-photo" id="emptyPhoto">
          <div class="camera-circle" aria-hidden="true">
            <svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M11 14h7l3-4h7l3 4h6a4 4 0 0 1 4 4v17a4 4 0 0 1-4 4H11a4 4 0 0 1-4-4V18a4 4 0 0 1 4-4Z"/><circle cx="24" cy="26" r="7"/><circle cx="35" cy="20" r="1" fill="currentColor" stroke="none"/></svg>
          </div>
          <p class="empty-title">把餐食放进镜头</p>
          <p class="empty-subtitle">一张照片，看看这顿大概多少热量</p>
        </div>
        <img id="preview" class="photo-preview" alt="待分析的餐食照片" hidden />
        <div class="photo-tag" id="photoTag" hidden><span class="tag-dot"></span> 已选择照片</div>
      </div>

      <div class="photo-actions">
        <button type="button" class="button button-outline" id="cameraButton">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h4l2-2h4l2 2h4v12H4V7Z"/><circle cx="12" cy="13" r="3"/></svg>
          拍照
        </button>
        <button type="button" class="button button-outline" id="galleryButton">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="9" r="1.5"/><path d="m4 17 5-5 3 3 3-4 5 6"/></svg>
          从相册选
        </button>
      </div>
      <input type="file" id="cameraInput" accept="image/*" capture="environment" hidden />
      <input type="file" id="galleryInput" accept="image/*" hidden />
      <button type="button" class="button button-primary" id="analyzeButton" disabled>
        <span id="buttonText">先拍摄或选择照片</span>
        <svg id="buttonArrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m5 12 14 0m-6-6 6 6-6 6"/></svg>
      </button>
      <p class="status-message" id="statusMessage" role="status" aria-live="polite"></p>
    </section>

    <section class="results-section" aria-labelledby="results-title">
      <div class="section-heading">
        <h2 id="results-title">识别结果</h2>
        <span class="step">02 / 02</span>
      </div>
      <div class="result-card" id="resultCard">
        <div class="result-empty" id="resultEmpty">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 4h16v16H4z"/><path d="M8 9h8M8 13h8M8 17h5"/></svg>
          <span>识别后，这里会列出食物和热量</span>
        </div>
        <div id="resultData" hidden>
          <div class="table-header"><span>食物 · 估算重量</span><span>估算热量</span></div>
          <div id="foodList"></div>
          <div class="total-row">
            <div><div class="total-label">合计热量</div><div class="total-desc" id="totalDesc">本次拍摄的餐食</div></div>
            <div class="total-number"><strong id="totalKcal">0</strong><span>kcal</span></div>
          </div>
        </div>
        <p class="non-food" id="nonFood" hidden>未识别到明确的食物，请重新拍摄。</p>
      </div>
      <p class="disclaimer">仅为 AI 图片估算。实际重量、食材及烹饪用油可能导致较大误差。</p>
    </section>
    <details class="settings">
      <summary>访问设置（可选）</summary>
      <label for="accessCode">访问码</label>
      <input id="accessCode" type="password" autocomplete="off" placeholder="若站长设置了访问码，在此输入" />
      <p>仅在站长为网站配置了 SITE_ACCESS_CODE 时需要填写。</p>
    </details>
  </main>
</body>
</html>
